# Type-check configuration for harness itself.
#
# Two jobs:
#
# 1. Reproducibility across the mypy 1.x/2.x boundary. mypy 2.0 flipped
#    `local_partial_types` and `strict_bytes` ON by default and changed
#    `allow_redefinition` semantics, so a checkout that inherits "whatever the
#    installed mypy defaults to" can flip verdict from a version bump alone —
#    exactly the failure mode the pipeline's own validation legs guard against.
#    Everything load-bearing is therefore stated explicitly.
# 2. `PipelineConfig._has_mypy_config()` now returns True for harness, so
#    harness's own dogfood run (`harness pipeline run` pointed at this repo)
#    gets the type-check leg it used to skip — the leg that covers grounding's
#    one blind spot, local-variable types.
[mypy]
# The floor from setup.py's `python_requires`. Stated, not inferred from the
# interpreter that happens to be running: mypy 2.x rejects anything below 3.10
# outright (as a *config* error, not a type error), so this value is also what
# keeps the autodetected `mypy .` leg runnable at all.
python_version = 3.10

# mypy 2.0 defaults, pinned so 1.x and 2.x agree.
local_partial_types = True
strict_bytes = True
allow_redefinition = False

# mypy 2.4 flipped `native_parser` ON. Not a drop-in: it ignores `for`/`with`
# type comments and gates newer syntax against `python_version` differently
# (2.4 rejects `Generic[*Ts]` under 3.10, which 2.3 accepted; it accepts
# `lazy import`, which 2.3 rejected). Pinned to the parser every 2.x before 2.4
# uses, so the whole `>=2.0,<3` range agrees. Revisit when mypy drops the
# legacy parser (announced for early 2027) — and note `num_workers` forces the
# native parser regardless of this line.
# Native-parser results also depend on the unpinned ast_serialize version.
native_parser = False

# Not `strict = True`: harness is not clean under it yet, and a config that
# cannot pass is not a gate — it is a permanent red. These are the checks the
# codebase already holds itself to.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = True

# Optional extras (z3) and build artifacts are not part of the type-checked
# surface.
exclude = (?x)(
    ^build/
    | ^\.venv/
    | ^\.harness
  )

[mypy-z3.*]
ignore_missing_imports = True
